<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="100%" height="10">
  <style>
    .pulse-line {
      stroke: #c084fc; /* Bright Kuromi purple */
      stroke-width: 1.5px;
      animation: pulse 2s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% {
        opacity: 0.3;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
  <line x1="0" y1="5" x2="1000" y2="5" class="pulse-line" stroke-linecap="round" />
</svg>
